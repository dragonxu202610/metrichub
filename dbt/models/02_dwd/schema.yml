version: 2

models:
  - name: dwd_order
    description: 粒度：1 行/订单（含 touch_cnt 线性归因分母）。订单 + 触点数(线性归因分母)
    columns:
      - name: user_id
        tests: [not_null]
      - name: plan
        tests:
          - accepted_values:
              values: [lite, pro]
      - name: amount
        tests: [not_null]
      - name: refund
        tests: [not_null]
      - name: touch_cnt
        description: 触点数, 无记录按 1 —— 线性归因的分母, 必须非空
        tests: [not_null]

  - name: dwd_user
    description: 粒度：1 行/注册用户（激活/留存/TTFC/付费派生宽表）。用户宽表(激活/留存/TTFC/付费等指标原料)
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: signup_date
        tests: [not_null]
      - name: channel_type
        tests:
          - accepted_values:
              values: [seo, influencer, paid, affiliate, direct]
      - name: retained_d1
        description: 严格次日留存(次日当天有活动, 非无界滚动) —— null 会让留存口径静默失真
        tests: [not_null]
      - name: activated_1d
        description: >
          首日激活(首次成功创作日=注册日)。注意三值逻辑: 窗口内从未成功创作的用户为 NULL
          (LEFT JOIN 不到 first_ok), 不是 FALSE —— 与原 ELT 行为一致, 故不设 not_null;
          消费端 filter(where activated_1d) 时 NULL 与 FALSE 等价, 但 avg() 会静默剔除 NULL。
      - name: ever_paid
        tests: [not_null]

  - name: dwd_task_ch
    description: 粒度：1 行/任务（dwd_task 同粒度挂渠道列——预 join 取舍见语义层页）。任务 × 获取渠道(北极星按渠道归因的接缝表)
    columns:
      - name: user_id
        tests: [not_null]
      - name: model
        tests: [not_null]
      - name: channel
        tests: [not_null]
      - name: channel_type
        tests:
          - accepted_values:
              values: [seo, influencer, paid, affiliate, direct]
